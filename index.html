<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Sprite XML Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: white; }
        canvas { border: 1px solid #fff; max-width: 100%; height: auto; display: block; margin: 10px 0; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
    <h2>Generador XML para FNF</h2>
    <input type="file" id="fileInput" multiple accept="image/*">
    <div class="controls">
        <label>Nombre de la animación: <input type="text" id="animName" value="idle"></label>
        <button onclick="generar()">Procesar y Exportar XML</button>
    </div>
    <canvas id="canvas"></canvas>
    <a id="downloadLink" style="display:none">Descargar XML</a>

    <script>
        async function generar() {
            const files = Array.from(document.getElementById('fileInput').files).sort();
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const animName = document.getElementById('animName').value;
            
            let xmlContent = '<?xml version="1.0" encoding="UTF-8"?>\n<TextureAtlas imagePath="sprites.png">\n';
            let x = 0, y = 0, maxHeight = 0;
            const images = [];

            // Cargar imágenes
            for (let file of files) {
                const img = await createImageBitmap(file);
                images.push({img, name: file.name.split('.')[0]});
            }

            // Calcular layout simple (fila)
            canvas.width = 2048; // Ancho máximo seguro
            canvas.height = 2048; 
            
            for (let item of images) {
                ctx.drawImage(item.img, x, y);
                xmlContent += `\t<SubTexture name="${item.name}0000" x="${x}" y="${y}" width="${item.img.width}" height="${item.img.height}"/>\n`;
                x += item.img.width;
                maxHeight = Math.max(maxHeight, item.img.height);
            }
            xmlContent += '</TextureAtlas>';

            // Descarga
            const blob = new Blob([xmlContent], {type: 'text/xml'});
            const link = document.getElementById('downloadLink');
            link.href = URL.createObjectURL(blob);
            link.download = animName + ".xml";
            link.style.display = 'block';
            link.innerText = "¡XML Generado! Click aquí para descargar";
        }
    </script>
</body>
</html>
